<div
  ng-controller="baseProjetoCtrl"
  class="d-flex flex-column align-items-center bg-ligth p-4"
>
  <h2 class="text-center mt-2">Cadastro de Contatos</h2>
  <form name="formCadastro" class="d-flex flex-column gap-3">
    <div class="form-group">
      <div class="col-md-12">
        <label for="">Nome</label>
        <input
          type="text"
          class="form-control"
          ng-model="contato.nomeCompleto"
          ng-required="true"
          name="nomeCompleto"
          placeholder="Seu nome Completo"
        />
      </div>
    </div>
    <div class="form-group d-flex align-items-center justify-content-around">
      <div class="col-md-2">
        <label for="">CPF</label>
        <input
          type="text"
          class="form-control"
          name="cpf"
          ng-model="contato.cpf"
          ng-required="true"
          format-cpf
        />
      </div>

      <div class="col-md-3">
        <label>Data Nascimento</label>
        <input
          type="text"
          class="form-control"
          name="dataNascimento"
          ng-model="contato.dataNascimento"
          ng-required="true"
          format-date
        />
      </div>

      <div class="col-md-4 text-center p-4">
        <label>Sexo</label>
        <div class="d-flex align-items-center justify-content-center gap-3">
          <input
            class="form-check-input"
            type="radio"
            name="check"
            ng-model="contato.sexo"
            ng-required="true"
            value="masculino"
          />
          <label class="form-check-label" for="flexRadioDefault1">
            masculino
          </label>

          <input
            class="form-check-input"
            type="radio"
            name="check"
            ng-model="contato.sexo"
            ng-required="true"
            value="feminino"
          />
          <label class="form-check-label" for="flexRadioDefault2">
            feminino
          </label>
        </div>
      </div>

      <div class="col-md-2">
        <label>Estado Civil</label>
        <select
          ng-model="contato.estadoCivil"
          ng-required="true"
          class="form-select"
          aria-label="Default select example"
        >
          <option selected>Selecione</option>
          <option value="casado">Solteira(a)</option>
          <option value="casado">Casado(a)</option>
          <option value="divorciado">Divorciado(a)</option>
          <option value="viuvo">Viuvo(a)</option>
        </select>
      </div>
    </div>

    <div class="form-group d-flex justify-content-around">
      <div class="col-md-2">
        <label for="">Renda Mensal</label>
        <input
          type="text"
          class="form-control"
          name="rendaMensal"
          ng-model="contato.rendaMensal"
          ng-required="true"
        />
      </div>

      <div class="col-md-2">
        <label for="">CEP</label>
        <input
          ng-blur="carregaEndereco(contato.cep)"
          type="text"
          class="form-control"
          name="cep"
          ng-model="contato.cep"
          ng-required="true"
        />
      </div>

      <div class="col-md-4">
        <label for="">Logradouro</label>
        <input
          type="text"
          class="form-control"
          name="logradouro"
          ng-model="contato.logradouro"
          ng-required="true"
        />
      </div>

      <div class="col-md-3">
        <label for="">Bairro</label>
        <input
          type="text"
          class="form-control"
          name="bairro"
          ng-model="contato.bairro"
          ng-required="true"
        />
      </div>
    </div>

    <div class="form-group d-flex justify-content-around">
      <div class="col-md-2">
        <label for="">Número</label>
        <input
          type="text"
          class="form-control"
          name="numero"
          ng-model="contato.numero"
          ng-required="true"
        />
      </div>

      <div class="col-md-4">
        <label for="">Complemento</label>
        <input
          type="text"
          class="form-control"
          name="complemento"
          ng-model="contato.complemento"
        />
      </div>

      <div class="col-md-3">
        <label for="">Cidade</label>
        <input
          type="text"
          class="form-control"
          name="cidade"
          ng-model="contato.cidade"
          ng-required="true"
        />
      </div>

      <div class="col-md-2">
        <label for="">Estado</label>
        <input
          type="text"
          class="form-control"
          name="estado"
          ng-model="contato.estado"
          ng-required="true"
        />
      </div>
    </div>

    <div class="col-md-12 mt-2 d-flex justify-content-end">
      <button
        ng-click="adicionarContato(contato)"
        ng-disabled="formCadastro.$invalid"
        class="btn btn-primary"
      >
        Cadastrar
      </button>
    </div>
  </form>
</div>
